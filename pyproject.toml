[project]
name = "gravitynet"
version = "0.1.0"
description = "GravityNet: gravity points based network for small lesion detection"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0",
    "torchvision>=0.15",
    "numpy",
    "pandas",
    "scikit-image",
    "scikit-learn",
    "opencv-python",
    "matplotlib",
    "tifffile",
    "tqdm",
    "pyyaml",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = [
    { index = "pytorch-cu124", marker = "sys_platform == 'linux'" },
]
torchvision = [
    { index = "pytorch-cu124", marker = "sys_platform == 'linux'" },
]

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true
